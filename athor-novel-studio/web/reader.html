<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史章节阅读</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f4f6fa; color: #1f2937;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  header {
    background: linear-gradient(90deg, #16324f, #1e3a5f);
    color: #fff; padding: 14px 24px;
    display: flex; align-items: center; gap: 16px;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; opacity: .72; }
  header a {
    margin-left: auto; color: #fff; text-decoration: none; font-size: 13px;
    background: rgba(255,255,255,.14); padding: 7px 14px; border-radius: 7px;
  }
  header a:hover { background: rgba(255,255,255,.26); }
  main {
    display: grid; grid-template-columns: 280px minmax(0, 1fr);
    gap: 18px; padding: 18px 24px 40px; align-items: start;
    max-width: 1240px; margin: 0 auto;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: #fff; border-radius: 12px; padding: 16px;
    box-shadow: 0 1px 3px rgba(16, 42, 67, .08);
  }
  .side { position: sticky; top: 78px; display: flex; flex-direction: column; gap: 12px; }
  select {
    width: 100%; padding: 9px 10px; font-size: 13px; border: 1px solid #d6dee9;
    border-radius: 8px; background: #fff; outline: none;
  }
  select:focus { border-color: #3b82f6; }
  .list { max-height: calc(100vh - 220px); overflow-y: auto; padding-right: 4px; }
  .vol {
    font-size: 12px; color: #64748b; margin: 14px 0 6px;
    padding-bottom: 4px; border-bottom: 1px dashed #e2e8f0;
  }
  .vol:first-child { margin-top: 0; }
  .ch {
    display: flex; gap: 8px; align-items: baseline; font-size: 13px;
    padding: 7px 9px; border-radius: 7px; cursor: pointer; color: #334155;
    line-height: 1.5;
  }
  .ch:hover { background: #eef4ff; }
  .ch.active { background: #1e3a5f; color: #fff; }
  .ch .no { font-size: 11px; opacity: .65; flex: none; }
  .ch .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch .draft { font-size: 11px; color: #b45309; }
  .ch.active .draft { color: #fde68a; }
  .reader { min-height: 60vh; padding: 28px 40px 36px; }
  @media (max-width: 640px) { .reader { padding: 20px 18px; } }
  .reader .crumb { font-size: 12.5px; color: #64748b; margin-bottom: 8px; }
  .reader h2 { margin: 0 0 10px; font-size: 24px; color: #14293f; line-height: 1.4; }
  .reader .meta { font-size: 12.5px; color: #7b8a9d; margin-bottom: 22px; }
  .content {
    white-space: pre-wrap; word-break: break-word;
    font-size: 17px; line-height: 1.95; color: #26313f;
    font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
  }
  .summary {
    margin: 0 0 22px; padding: 12px 14px; background: #f8fbff;
    border: 1px solid #e2ecf8; border-radius: 8px; font-size: 13px;
    line-height: 1.8; color: #475569;
  }
  .summary summary { cursor: pointer; color: #1e3a5f; font-weight: 600; }
  .summary p { margin: 8px 0 0; }
  .pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 32px; }
  .pager button {
    border: 1px solid #d6dee9; background: #fff; color: #1e3a5f;
    border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer;
  }
  .pager button:hover:not(:disabled) { background: #eef4ff; }
  .pager button:disabled { opacity: .45; cursor: not-allowed; }
  .empty { padding: 60px 20px; text-align: center; color: #9aa8ba; font-size: 14px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #b6c2d1; }
</style>
</head>
<body>
<header>
  <div>
    <h1>历史章节阅读</h1>
    <div class="sub" id="book-info">正在加载…</div>
  </div>
  <a href="/">返回工作台</a>
</header>

<main>
  <aside class="panel side">
    <select id="book-select"></select>
    <div class="list" id="chapter-list">
      <div class="empty">正在加载目录…</div>
    </div>
  </aside>

  <section class="panel reader" id="reader">
    <div class="empty">请选择左侧章节开始阅读</div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);

let chapters = [];
let currentIndex = -1;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g,
  (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

function setUrl(outlineId, chapterId) {
  const p = new URLSearchParams();
  if (outlineId) p.set("outline_id", outlineId);
  if (chapterId) p.set("chapter_id", chapterId);
  history.replaceState(null, "", p.toString() ? "?" + p.toString() : location.pathname);
}

async function loadBooks() {
  const resp = await fetch("/api/library/books");
  if (!resp.ok) throw new Error("书籍列表读取失败");
  const books = await resp.json();
  if (!books.length) {
    $("book-select").innerHTML = '<option value="">暂无已写章节</option>';
    $("chapter-list").innerHTML = '<div class="empty">还没有生成过正文</div>';
    $("book-info").textContent = "暂无已写章节";
    return;
  }
  $("book-select").innerHTML = books.map((b) =>
    `<option value="${b.outline_id}">${esc(b.title || "未命名")}（${b.chapters} 章）</option>`
  ).join("");
  const wanted = params.get("outline_id");
  const exists = books.some((b) => String(b.outline_id) === wanted);
  $("book-select").value = exists ? wanted : String(books[0].outline_id);
  $("book-select").onchange = () => loadChapters(Number($("book-select").value));
  await loadChapters(Number($("book-select").value));
}

function renderList() {
  const groups = [];
  let lastVolume = null;
  chapters.forEach((c, idx) => {
    if (c.volume_no !== lastVolume) {
      lastVolume = c.volume_no;
      groups.push(`<div class="vol">第 ${c.volume_no} 卷 · ${esc(c.volume_title || "")}</div>`);
    }
    const draft = c.status === "草稿" ? '<span class="draft">草稿</span>' : "";
    groups.push(
      `<div class="ch" data-idx="${idx}">` +
      `<span class="no">${c.chapter_no}</span>` +
      `<span class="name">${esc(c.title || ("第 " + c.chapter_no + " 章"))}</span>${draft}</div>`
    );
  });
  $("chapter-list").innerHTML = groups.join("") ||
    '<div class="empty">这本小说还没有正文</div>';
  $("chapter-list").querySelectorAll(".ch").forEach((el) => {
    el.onclick = () => openChapter(Number(el.dataset.idx));
  });
}

async function loadChapters(outlineId) {
  $("chapter-list").innerHTML = '<div class="empty">正在加载目录…</div>';
  const resp = await fetch(`/api/library/chapters?outline_id=${outlineId}`);
  chapters = resp.ok ? await resp.json() : [];
  currentIndex = -1;
  renderList();
  const title = $("book-select").selectedOptions[0]?.textContent || "";
  $("book-info").textContent = title;

  const wanted = Number(params.get("chapter_id") || 0);
  let target = chapters.findIndex((c) => c.id === wanted);
  if (target < 0) target = 0;
  if (chapters.length) openChapter(target);
}

function highlight() {
  $("chapter-list").querySelectorAll(".ch").forEach((el) => {
    el.classList.toggle("active", Number(el.dataset.idx) === currentIndex);
  });
  const active = $("chapter-list").querySelector(".ch.active");
  if (active) active.scrollIntoView({ block: "nearest" });
}

async function openChapter(idx) {
  if (idx < 0 || idx >= chapters.length) return;
  currentIndex = idx;
  highlight();
  const item = chapters[idx];
  setUrl($("book-select").value, item.id);
  $("reader").innerHTML = '<div class="empty">正在加载正文…</div>';
  try {
    const resp = await fetch(`/api/library/chapters/${item.id}`);
    if (!resp.ok) throw new Error("章节读取失败");
    const d = await resp.json();
    const summary = d.summary
      ? `<details class="summary"><summary>本章摘要</summary>` +
        `<p>${esc(d.summary)}</p></details>`
      : "";
    $("reader").innerHTML =
      `<div class="crumb">第 ${d.volume_no} 卷 · ${esc(d.volume_title || "")}` +
      ` · ${esc(d.short_title || "")}</div>` +
      `<h2>第 ${d.chapter_no} 章 ${esc(d.title || d.outline_title || "")}</h2>` +
      `<div class="meta">${d.word_count || 0} 字` +
      (d.updated_at ? ` · 更新于 ${esc(String(d.updated_at).replace("T", " ").slice(0, 16))}` : "") +
      (d.status === "草稿" ? " · 草稿" : "") + `</div>` +
      summary +
      `<div class="content">${esc(d.content || "")}</div>` +
      `<div class="pager">` +
      `<button id="btn-prev" ${idx <= 0 ? "disabled" : ""}>← 上一章</button>` +
      `<button id="btn-next" ${idx >= chapters.length - 1 ? "disabled" : ""}>下一章 →</button>` +
      `</div>`;
    $("btn-prev").onclick = () => openChapter(idx - 1);
    $("btn-next").onclick = () => openChapter(idx + 1);
    $("reader").scrollIntoView({ block: "start" });
  } catch (e) {
    $("reader").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" && currentIndex > 0) openChapter(currentIndex - 1);
  if (e.key === "ArrowRight" && currentIndex < chapters.length - 1) openChapter(currentIndex + 1);
});

loadBooks().catch((e) => {
  $("book-info").textContent = e.message;
  $("chapter-list").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
});
</script>
</body>
</html>
